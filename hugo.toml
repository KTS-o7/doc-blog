baseURL = "https://KTS-o7.github.io/bear"
languageCode = "en-us"

# ===== THEME =====
# Default: TeXify3 — LaTeX-style, KaTeX math + Mermaid diagrams
# To test Shibui, comment below and uncomment the shibui line
theme = "hugo-texify3"
# theme = "shibui"
# theme = "hugo-bearcub"

copyright = "Krishnatejaswi S"
defaultContentLanguage = "en"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
  tags = "tags"
  categories = "categories"

[markup]
  # Syntax highlighting
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    noClasses = false

  # TeXify3 renders KaTeX natively — no passthrough hack needed
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

# Parameters — shared across TeXify3 and Shibui
[params]
  # KaTeX math rendering (TeXify3 natively; Shibui needs manual setup)
  math = true

  # Table of contents on posts
  toc = true

  # Auto-numbered headings (1.1, 1.2…)
  numberedSubtitles = true

  # Emphasis dots after headings
  emphasisWithDots = true

  # Date format
  dateFormat = "2006-01-02"

  # Base font size
  rootFontSize = "105%"

  # Site description for SEO / RSS
  description = "Technical notes on distributed systems, ML, and software"

  # Path to your favicon
  favicon = "images/favicon.png"

  # Open Graph / Twitter Card preview image
  images = ["images/share.webp"]

  # DuckDuckGo search box (off by default)
  enableDuckDuckGoSearchBox = false

  # Footer note
  footnote = "Powered by <a class=link href=https://gohugo.io target=_blank rel=noopener>Hugo</a> | Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>"

  # Author metadata for RSS feed and footer
  [params.author]
    name = "Krishnatejaswi S"
    email = "shentharkrishnatejaswi@gmail.com"

  # Social sharing buttons
  [params.sharingbuttons]
    facebook = false
    twitter = true
    email = true
    linkedin = true
    reddit = true
    hackernews = true
    telegram = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
