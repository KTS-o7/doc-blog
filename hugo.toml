baseURL = "https://KTS-o7.github.io/bear/"
title = "Krishnatejaswi S"
languageCode = "en-us"

theme = "hugo-bearcub"
copyright = "Krishnatejaswi S"
defaultContentLanguage = "en"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# Setup syntax highlighting without inline styles
[markup]
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

# Related content configuration
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "keywords"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1
    [languages.en.params]
      madeWith = "Made with [Bear Cub](https://github.com/clente/hugo-bearcub)"

# Parameters
[params]
  # The path to your favicon (add this file to static/images/favicon.png)
  favicon = "images/favicon.png"

  # These images will show up when services want to generate a preview of a link
  # to your site. Add these to static/images/
  images = ["images/share.webp"]

  # Dates are displayed following this format
  dateFormat = "2006-01-02"

  # Math rendering support
  math = true

  # Hide untranslated pages (for future multilingual support)
  hideUntranslated = false

  # Theme style: "original" or "herman"
  themeStyle = "herman"

  # Site-wide description fallback (used when a page has no description frontmatter)
  description = "A research notebook on distributed systems, machine learning, mathematics, and infrastructure engineering. Written by Krishnatejaswi S."

  # Twitter/X handle for twitter:site meta tag
  twitterSite = "@KTS_o7"

  # Generate social cards for posts without images
  generateSocialCard = false

  # Author metadata for RSS feed and footer
  [params.author]
    name = "Krishnatejaswi S"
    email = "shentharkrishnatejaswi@gmail.com"

[outputFormats]
  [outputFormats.llms]
    name = "llms"
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Navigation menu entries are defined via frontmatter menu params in _index.md files

# Sitemap defaults — individual posts can override via frontmatter [sitemap] block
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"
